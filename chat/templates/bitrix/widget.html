<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script src="https://api.bitrix24.com/api/v1/"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h3>Управление AI-продавцом</h3>
  <button id="disableBtn">Отключить AI-продавца</button>
  <button id="enableBtn">Включить AI-продавца</button>

  <script>
    var placementOptions = {{ placement_options_json|safe }};
    var appBaseUrl = "{{ app_base_url|escapejs }}";
    console.log("Placement options from server:", placementOptions);

    var contactId = placementOptions.ID;
    if (!contactId) {
      document.body.insertAdjacentHTML('beforeend',
        '<p style="color:red">Ошибка: не удалось определить ID контакта.</p>'
      );
      throw new Error("Contact ID is missing");
    }

    function callWebhook(endpoint, onSuccessMessage, onErrorMessage) {
      fetch(appBaseUrl + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: contactId })
      })
      .then(res => res.json())
      .then(data => {
        console.log("Response:", data);
        alert(data.message || onSuccessMessage);
      })
      .catch(err => {
        console.error("Error:", err);
        alert(onErrorMessage);
      });
    }

    document.getElementById("disableBtn").onclick = function () {
      callWebhook("/chat/webhook/disable-gpt/", "AI-продавец отключён", "Ошибка отключения AI-продавца");
    };

    document.getElementById("enableBtn").onclick = function () {
      callWebhook("/chat/webhook/enable-gpt/", "AI-продавец включён", "Ошибка включения AI-продавца");
    };
  </script>
</body>
</html>
